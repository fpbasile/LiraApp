="background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 18px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 500; color: #F5F5F4">0</button><button aria-label="Delete" onClick="{{ back }}" style="background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 18px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 500; color: #F5F5F4"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A8A8AD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block;"><path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg></button></div></div><div aria-hidden="true" style="height: 82px; flex-shrink: 0"></div><nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; gap: 4px; padding: 4px; border-radius: 28px; background: #1C1C1F"><button aria-label="Home" aria-current="page" style="background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; flex: 1.4; height: 48px; border-radius: 24px; background: #323237; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #F5F5F4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5F5F4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block;"><circle cx="6" cy="6" r="1.25"></circle><circle cx="12" cy="6" r="1.25"></circle><circle cx="18" cy="6" r="1.25"></circle><circle cx="6" cy="12" r="1.25"></circle><circle cx="12" cy="12" r="1.25"></circle><circle cx="18" cy="12" r="1.25"></circle><circle cx="6" cy="18" r="1.25"></circle><circle cx="12" cy="18" r="1.25"></circle><circle cx="18" cy="18" r="1.25"></circle></svg>Home</button><button aria-label="Insights" style="background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#85858B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block;"><path d="M5 20v-7M12 20V4M19 20v-10"></path></svg></button><button aria-label="More" style="background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#85858B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block;"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg></button></nav><div aria-hidden="true" style="position: absolute; bottom: 8px; left: 50%; width: 108px; height: 4px; margin-left: -54px; border-radius: 2px; background: rgba(255,255,255,0.34)"></div><sc-if value="{{ flying }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 262px; text-align: center; pointer-events: none; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 64px; font-weight: 600; letter-spacing: -0.03em; color: #F5F5F4; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; animation: liraFly 420ms cubic-bezier(.65,0,.35,1) forwards">{{ flyText }}</div></sc-if></div>

<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#5D926D", "options": ["#5D926D", "#91CAA9", "#A9A6FF", "#F5F5F4"], "section": "Look"}, "dailyLimit": {"editor": "int", "default": 60, "min": 10, "max": 500, "step": 5, "unit": "€", "section": "Budget"}, "$preview": {"width": 412, "height": 915}}'>
const CATS = { groceries: 'Groceries', eating: 'Eating out', coffee: 'Coffee', transport: 'Transport', shopping: 'Shopping' };
const TINT = { groceries: 'rgba(233,196,106,', eating: 'rgba(203,122,93,', coffee: 'rgba(147,115,84,', transport: 'rgba(109,163,218,', shopping: 'rgba(176,157,233,' };
const PAYERS = { salary: 'Salary', marco: 'Marco', giulia: 'Giulia' };
const WEEK_BEFORE_TODAY = 244.75;
const WEEK_LIMIT = 450;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amt: '', mode: 'expense', picked: null, pressed: null, spent: 7.2, shown: 7.2, animating: false,
                   snack: null, last: null, flying: false, flyText: '', note: '', glowBoost: false };
    this.timers = [];
    this.raf = 0;
  }
  componentWillUnmount() { this.clearTimers(); if (this.raf) cancelAnimationFrame(this.raf); }
  later(ms, fn) { const t = setTimeout(fn, ms); this.timers.push(t); return t; }
  clearTimers() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; }
  limit() { const l = Number(this.props.dailyLimit); return l > 0 ? l : 60; }
  value() { return parseFloat(this.state.amt || '0') || 0; }
  fmt2(n) { return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  fmtShort(n) {
    const r = Math.round(n * 100) / 100;
    return Math.abs(r - Math.round(r)) < 0.005 ? Math.round(r).toLocaleString('en-US') : this.fmt2(r);
  }
  flash(note) {
    this.setState({ note });
    if (this.noteT) clearTimeout(this.noteT);
    this.noteT = setTimeout(() => this.setState({ note: '' }), 2600);
  }
  press(d) {
    let a = this.state.amt;
    if (d === '.') {
      if (a.indexOf('.') >= 0) return;
      a = (a === '' ? '0' : a) + '.';
    } else {
      if (a.indexOf('.') >= 0) {
        if (a.split('.')[1].length >= 2) return;
      } else {
        if (a.length >= 7) return;
        if (a === '0') a = '';
      }
      a = a + d;
    }
    this.setState({ amt: a, snack: null, note: '' });
  }
  back() { this.setState({ amt: this.state.amt.slice(0, -1), note: '' }); }
  tapItem(key) {
    if (this.value() > 0) this.save(key);
    else this.setState({ picked: this.state.picked === key ? null : key, snack: null });
  }
  tapSave() {
    if (this.value() > 0 && this.state.picked) this.save(this.state.picked);
    else if (this.value() > 0) this.flash(this.state.mode === 'expense' ? 'Pick a category first' : 'Pick who paid you first');
  }
  animateTo(target) {
    if (this.raf) cancelAnimationFrame(this.raf);
    const from = this.state.shown;
    const t0 = performance.now();
    const dur = 540;
    this.setState({ animating: true });
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      this.setState({ shown: from + (target - from) * e, animating: p < 1 });
      if (p < 1) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  save(key, override) {
    const v = override || this.value();
    if (!(v > 0)) return;
    const s = this.state;
    const isExp = s.mode === 'expense';
    const before = s.spent;
    const after = isExp ? before + v : before;
    const LIMIT = this.limit();
    const amtTxt = '€' + this.fmt2(v);
    let title, sub = '', over = false;
    if (isExp) {
      title = CATS[key] + ' · ' + amtTxt + ' saved';
      if (after > LIMIT + 0.004) {
        over = true;
        sub = 'That’s €' + this.fmtShort(after - LIMIT) + ' over today — still €' + this.fmt2(WEEK_LIMIT - WEEK_BEFORE_TODAY - after) + ' left this week.';
      }
    } else {
      title = '+' + amtTxt + (key === 'salary' ? ' salary' : ' from ' + PAYERS[key]) + ' saved';
    }
    this.clearTimers();
    this.setState({ amt: '', picked: null, pressed: key, flying: true, flyText: (isExp ? '' : '+') + amtTxt, spent: after,
                    snack: null, note: '', last: { before, amt: override ? '' : s.amt, mode: s.mode } });
    try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) {}
    this.later(100, () => this.setState({ pressed: null }));
    this.later(430, () => this.setState({ flying: false }));
    if (isExp) this.later(360, () => { this.animateTo(after); this.setState({ glowBoost: true }); });
    this.later(isExp ? 960 : 700, () => this.setState({ glowBoost: false }));
    if (!isExp) this.later(100, () => this.setState({ glowBoost: true }));
    this.later(isExp ? 900 : 420, () => { if (this.state.amt === '') this.setState({ snack: { title, sub, over } }); });
    this.later(isExp ? 4900 : 4420, () => this.setState({ snack: null, last: null }));
  }
  undo() {
    const L = this.state.last;
    if (!L) return;
    this.clearTimers();
    this.setState({ spent: L.before, snack: null, amt: L.amt, mode: L.mode, picked: null, last: null, flying: false, glowBoost: false });
    this.animateTo(L.before);
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#5D926D';
    const RED = '#FF5A5F';
    const LIMIT = this.limit();
    const left = LIMIT - s.shown;
    const over = left < -0.004;
    const pct = Math.max(0, Math.min(1, s.shown / LIMIT));
    const C = 2 * Math.PI * 18;
    const C2 = 2 * Math.PI * 11.2;
    const shownPct = over ? 1 : pct;
    const leftAbs = Math.abs(left);
    const leftNum = '€' + (s.animating ? this.fmt2(leftAbs) : this.fmtShort(leftAbs));
    const weekLeft = WEEK_LIMIT - WEEK_BEFORE_TODAY - s.spent;
    const isExp = s.mode === 'expense';
    const a = s.amt;
    let main = '', ghost = '0';
    if (a !== '') {
      const parts = a.split('.');
      const iFmt = parts[0] === '' ? '0' : Number(parts[0]).toLocaleString('en-US');
      if (a.indexOf('.') >= 0) { main = iFmt + '.' + parts[1]; ghost = '00'.slice(parts[1].length); }
      else { main = iFmt; ghost = ''; }
    }
    const len = (main + ghost).length;
    const amtSize = len <= 5 ? 88 : len <= 7 ? 72 : len <= 9 ? 58 : 46;
    const hasAmt = this.value() > 0;
    const pickedName = s.picked ? (isExp ? CATS[s.picked] : PAYERS[s.picked]) : '';
    let hintText;
    if (s.note) hintText = s.note;
    else if (!hasAmt) hintText = isExp ? 'Type an amount, tap a category' : 'Type an amount, tap who paid you';
    else if (s.picked) hintText = (isExp ? 'Save to log as ' : 'Save as income from ') + pickedName;
    else hintText = isExp ? 'Tap a category to save' : 'Tap who paid you to save';
    const chipFx = (key, tint) => {
      if (s.pressed === key) return 'transform: scale(0.95); box-shadow: inset 0 0 0 1.5px #F5F5F4;' + (tint ? ' background: ' + tint + '0.24);' : ' background: #26262A;');
      if (s.picked === key) return 'box-shadow: inset 0 0 0 1.5px #F5F5F4;' + (tint ? ' background: ' + tint + '0.14);' : ' background: #1C1C1F;');
      return '';
    };
    const cs = {}; Object.keys(CATS).forEach((k) => { cs[k] = chipFx(k, TINT[k]); });
    const ps = {}; Object.keys(PAYERS).forEach((k) => { ps[k] = chipFx(k, null); });
    const ready = hasAmt && !!s.picked;
    const showSnack = !!s.snack;
    const h = {};
    '0123456789'.split('').forEach((d) => { h['d' + d] = () => this.press(d); });
    return Object.assign(h, {
      accent,
      ringColor: over ? RED : accent,
      ringCap: (shownPct > 0.004) ? 'round' : 'butt',
      ringDash: (C * shownPct).toFixed(2) + ' ' + C.toFixed(2),
      lapDash: (C2 * Math.max(0.06, Math.min(s.shown / LIMIT - 1, 1))).toFixed(2) + ' ' + C2.toFixed(2),
      lapOpacity: over ? 1 : 0,
      glowOp: s.glowBoost ? 1 : (over ? 0.2 : 0.53),
      leftNum,
      leftWord: over ? 'over today' : 'left today',
      leftColor: over ? RED : accent,
      stripSub: over ? '€' + this.fmt2(weekLeft) + ' left this week' : 'of €' + this.fmtShort(LIMIT) + ' · Sat 14 Nov',
      expStyle: isExp ? 'background: #26262A; color: #F5F5F4; font-weight: 600;' : 'background: transparent; color: #85858B; font-weight: 500;',
      incStyle: !isExp ? 'background: #26262A; color: #F5F5F4; font-weight: 600;' : 'background: transparent; color: #85858B; font-weight: 500;',
      isExp, isInc: !isExp,
      showRepeat: isExp && a === '' && !showSnack && !s.flying,
      amtMain: main, amtGhost: ghost, amtSize, symSize: Math.round(amtSize * 0.42),
      amtColor: a === '' ? '#85858B' : '#F5F5F4',
      ghostColor: a === '' ? '#85858B' : '#4E4E54',
      showHint: !showSnack, hintText, hintColor: s.note ? '#F5F5F4' : (hasAmt ? '#A8A8AD' : '#85858B'),
      showOpts: !showSnack,
      showSnack, snackOk: showSnack && !s.snack.over, snackOver: showSnack && s.snack.over,
      snackTitle: showSnack ? s.snack.title : '', snackSub: showSnack ? s.snack.sub : '',
      flying: s.flying, flyText: s.flyText,
      cs, ps,
      c_groceries: () => this.tapItem('groceries'), c_eating: () => this.tapItem('eating'), c_coffee: () => this.tapItem('coffee'),
      c_transport: () => this.tapItem('transport'), c_shopping: () => this.tapItem('shopping'),
      p_salary: () => this.tapItem('salary'), p_marco: () => this.tapItem('marco'), p_giulia: () => this.tapItem('giulia'),
      dDot: () => this.press('.'), back: () => this.back(),
      tapSave: () => this.tapSave(),
      saveStyle: ready ? 'background: #F5F5F4; color: #0B0B0C;' : 'background: #141416; color: #4E4E54;',
      saveIcon: ready ? '#0B0B0C' : '#4E4E54',
      setExp: () => this.setState({ mode: 'expense', picked: null }),
      setInc: () => this.setState({ mode: 'income', picked: null }),
      repeat: () => this.save('eating', 12.5),
      undo: () => this.undo(),
      tapScan: () => this.flash('Opens the camera — see “Scan a receipt” below'),
      tapMore: () => this.flash('Opens the full list — see “Pick a category”'),
      tapStrip: () => this.flash('Opens the Today sheet — see “Today”'),
    });
  }
}
</script>
